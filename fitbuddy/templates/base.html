<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FitBuddy creates practical, personalized fitness plans with Gemini.">
  <title>{% block title %}FitBuddy{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}" aria-label="FitBuddy home">
      <span class="brand-mark">✦</span><span>FitBuddy</span>
    </a>
    <nav aria-label="Primary navigation">
      <a href="{{ url_for('home') }}">Create plan</a>
      <a href="{{ url_for('view_all_users') }}">Admin view</a>
      <a class="api-link" href="/docs">API docs ↗</a>
    </nav>
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span>FitBuddy · AI-assisted wellness planning</span>
    <span>Move consistently. Recover intentionally.</span>
  </footer>
  <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
</body>
</html>
